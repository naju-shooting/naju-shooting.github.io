<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 비로그인 접근 차단 보안 인증 스크립트 (가장 먼저 실행) -->
    <script src="auth-check.js"></script>
    <meta charset="UTF-8">
    <title>선수관리 (B01)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
        }
        .container {
            max-width: 1500px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .header-section {
            text-align: center;
            margin-bottom: 20px;
        }
        .contest-title-input {
            font-size: 2.2em;
            font-weight: bold;
            border: none;
            border-bottom: 2px solid var(--accent);
            background: transparent;
            text-align: center;
            width: 80%;
            padding: 10px;
            outline: none;
            color: var(--primary);
        }
        /* ... other styles omitted for brevity ... */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .btn {
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            color: white;
            transition: 0.2s;
        }
        .btn-excel { background: var(--success); }
        .btn-print { background: #8e44ad; }
        .btn-del-selected { background: var(--danger); }
        .btn {
            background: #e67e22;
            flex:none;
            margin-right:8px;
        }
    </style>
</head>
<body>
    <!-- body content unchanged ... -->
</body>
</html>

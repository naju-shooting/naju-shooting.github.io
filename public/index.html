<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사격장 통합 관리 시스템 - 보안 인증</title>
    <!-- 구글 폰트 및 Pretendard 웹폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: rgba(18, 24, 38, 0.85);
            --border-card: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --cyan-start: #38bdf8;
            --blue-end: #2563eb;
            --blue-glow: rgba(56, 189, 248, 0.3);
            --blue-border: rgba(56, 189, 248, 0.4);
            --error-color: #f43f5e;
            --error-glow: rgba(244, 63, 94, 0.3);
            --success-color: #10b981;
        }
        * { box-sizing: border-box; margin:0; padding:0; user-select:none; -webkit-user-drag:none; }
        body { font-family:'Pretendard','Noto Sans KR','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; background-color:var(--bg-dark); color:var(--text-primary); min-height:100vh; display:flex; flex-direction:column; justify-content:space-between; align-items:center; position:relative; overflow-x:hidden; background-image: radial-gradient(circle at 25% 25%, rgba(37,99,235,0.18), transparent 45%), radial-gradient(circle at 75% 75%, rgba(168,85,247,0.15), transparent 45%), radial-gradient(circle at 50% 50%, rgba(15,23,42,0.85), transparent 100%); }
        /* ... CSS omitted for brevity */
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <header class="top-header">
        <div class="system-logo">
            <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
            <div class="logo-title">사격장 통합 운영 시스템</div>
        </div>
        <div class="header-info"><div class="status-badge"><span>🔒 관리자 인증 필요</span></div><div class="clock-display" id="liveClock">0000.00.00 00:00:00</div></div>
    </header>
    <main class="auth-container"><div class="auth-card" id="authCard"><div class="lock-badge" id="lockBadge"><svg viewBox="0 0 24 24" id="lockIcon"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></div>
            <h1 class="auth-title">관리자 보안 인증</h1>
            <p class="auth-subtitle">통합 시스템에 접속하려면 관리자 암호를 입력하세요.</p>
            <form class="auth-form" onsubmit="handleLogin(event)">
                <div class="input-group"><svg class="input-icon" viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                    <input type="password" id="passwordInput" class="password-input" placeholder="암호 입력" autocomplete="current-password" autofocus required oninput="clearError()" onkeyup="checkCapsLock(event)">
                    <button type="button" class="toggle-btn" onclick="togglePasswordVisibility()" title="암호 보기/숨기기"><svg viewBox="0 0 24 24" id="eyeIcon"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg></button>
                </div>
                <div class="caps-warning" id="capsWarning">⚠️ Caps Lock이 켜져 있습니다</div>
                <div class="msg-box" id="msgBox"></div>
                <button type="submit" class="btn-submit" id="submitBtn"><span>시스템 접속하기</span><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
            </form>
        </div></main>
    <footer class="bottom-footer">© 2026 사격장 통합 관리 시스템 | Security Portal Gateway</footer>
    <script>
        const CORRECT_PASSWORD = "skwn" + "5857";
        const TARGET_URL = (window.location.protocol === 'file:' ? 'AAABBB.html' : '/AAABBB.html');
        function updateClock(){const now=new Date();const y=now.getFullYear();const mo=String(now.getMonth()+1).padStart(2,'0');const d=String(now.getDate()).padStart(2,'0');const h=String(now.getHours()).padStart(2,'0');const mi=String(now.getMinutes()).padStart(2,'0');const s=String(now.getSeconds()).padStart(2,'0');const el=document.getElementById('liveClock');if(el){el.textContent=`${y}.${mo}.${d} ${h}:${mi}:${s}`;}}
        setInterval(updateClock,1000);updateClock();
        function togglePasswordVisibility(){const input=document.getElementById('passwordInput');const eye=document.getElementById('eyeIcon');if(input.type==='password'){input.type='text';eye.innerHTML='<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';}else{input.type='password';eye.innerHTML='<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';}}
        function checkCapsLock(e){const w=document.getElementById('capsWarning');if(e.getModifierState && e.getModifierState('CapsLock')){w.style.display='flex';}else{w.style.display='none';}}
        function clearError(){const i=document.getElementById('passwordInput');const m=document.getElementById('msgBox');i.classList.remove('error');m.className='msg-box';m.textContent='';}
        function handleLogin(event){event.preventDefault();const i=document.getElementById('passwordInput');const card=document.getElementById('authCard');const msg=document.getElementById('msgBox');const btn=document.getElementById('submitBtn');const entered=i.value.trim();if(entered===CORRECT_PASSWORD){sessionStorage.setItem('isLoggedIn','true');localStorage.setItem('isLoggedIn','true');msg.className='msg-box success';msg.innerHTML='✓ 인증 성공! 시스템으로 이동합니다...';i.disabled=true;btn.disabled=true;btn.innerHTML='<span>접속 중...</span>';setTimeout(()=>{window.location.href=TARGET_URL;},350);}else{i.classList.add('error');msg.className='msg-box error';msg.innerHTML='⚠️ 암호가 올바르지 않습니다. 다시 입력해주세요.';card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');i.select();i.focus();}}
    </script>
</body>
</html>
